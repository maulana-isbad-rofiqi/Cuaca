<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cuaca Dashboard Pro</title>
    <meta name="theme-color" content="#1e1e2e">
    <meta name="description" content="Dashboard Cuaca Lengkap & Akurat">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1163/1163661.png">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --bg-dark: #121215;
            --card-bg: #1e1e2e;
            --card-glass: rgba(30, 30, 46, 0.7);
            --primary: #5c7cfa;
            --accent: #ff6b6b;
            --text-main: #ffffff;
            --text-sec: #a0a0b0;
            --radius: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; justify-content: center;
            padding: 20px 10px;
        }

        /* --- CONTAINER UTAMA --- */
        .app-container {
            width: 100%; max-width: 480px;
            display: flex; flex-direction: column; gap: 20px;
        }

        /* --- HEADER & SEARCH --- */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 0 5px; }
        .greeting h2 { font-size: 1.4rem; font-weight: 700; }
        .greeting p { font-size: 0.9rem; color: var(--text-sec); }
        .date-badge { background: #2c2c3a; padding: 8px 12px; border-radius: 12px; font-size: 0.8rem; color: var(--text-sec); font-weight: 600; }

        .search-bar {
            background: var(--card-bg); padding: 8px; border-radius: 20px;
            display: flex; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .search-bar input {
            flex: 1; background: transparent; border: none; padding: 0 15px;
            color: white; font-size: 1rem; outline: none;
        }
        .btn-icon {
            width: 45px; height: 45px; border-radius: 14px; border: none;
            background: var(--primary); color: white; cursor: pointer;
            font-size: 1.1rem; transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .btn-icon.secondary { background: #2c2c3a; color: var(--text-sec); }
        .btn-icon:active { transform: scale(0.92); }

        /* --- MAIN CARD (NOW) --- */
        .main-card {
            background: linear-gradient(135deg, #3a7bd5 0%, #3a6073 100%);
            border-radius: 30px; padding: 25px; color: white;
            position: relative; overflow: hidden; box-shadow: 0 15px 40px rgba(58, 123, 213, 0.3);
        }
        .main-card-header { display: flex; justify-content: space-between; align-items: flex-start; z-index: 2; position: relative; }
        .city-name { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .weather-status { background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; backdrop-filter: blur(5px); }
        
        .main-temp-wrapper { text-align: center; margin: 20px 0; z-index: 2; position: relative; }
        .main-icon { font-size: 5rem; margin-bottom: 5px; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2)); }
        .main-temp { font-size: 4.5rem; font-weight: 700; line-height: 1; margin-left: 15px; }
        
        .main-details { display: flex; justify-content: space-around; background: rgba(0,0,0,0.2); border-radius: 20px; padding: 15px; backdrop-filter: blur(5px); }
        .detail-item { text-align: center; }
        .detail-item i { font-size: 1.1rem; opacity: 0.8; margin-bottom: 5px; }
        .detail-item span { display: block; font-size: 0.9rem; font-weight: 600; }
        .detail-item small { font-size: 0.7rem; opacity: 0.7; }

        /* --- HOURLY SCROLL --- */
        .section-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; color: var(--text-main); }
        .section-title i { color: var(--primary); }

        .hourly-scroll {
            display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px;
            scrollbar-width: none; /* Firefox */
        }
        .hourly-scroll::-webkit-scrollbar { display: none; } /* Chrome */

        .hour-card {
            min-width: 70px; background: var(--card-bg); border-radius: 18px;
            padding: 15px 10px; text-align: center; display: flex; flex-direction: column; gap: 8px;
            border: 1px solid rgba(255,255,255,0.05); transition: 0.2s;
        }
        .hour-card.active { background: var(--primary); border-color: var(--primary); }
        .hour-time { font-size: 0.8rem; color: var(--text-sec); }
        .hour-card.active .hour-time { color: rgba(255,255,255,0.8); }
        .hour-icon { font-size: 1.2rem; margin: 5px 0; }
        .hour-temp { font-weight: 600; font-size: 1rem; }

        /* --- DAILY LIST --- */
        .daily-list { display: flex; flex-direction: column; gap: 10px; }
        .day-row {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 15px 20px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .day-name { width: 100px; font-weight: 500; }
        .day-icon { flex: 1; text-align: center; font-size: 1.2rem; color: var(--primary); }
        .day-temp { width: 100px; text-align: right; font-weight: 600; color: var(--text-sec); }
        .day-temp span { color: var(--text-main); margin-right: 5px; }

        /* --- UTILS --- */
        .loading-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--bg-dark); z-index: 999; display: flex;
            justify-content: center; align-items: center; flex-direction: column;
            gap: 15px; transition: opacity 0.5s;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--card-bg); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #installBtn {
            background: var(--text-main); color: var(--bg-dark); border: none;
            padding: 15px; border-radius: 18px; font-weight: 700; cursor: pointer;
            margin-top: 20px; display: none; width: 100%;
        }

        /* Responsive Fix */
        @media (max-width: 360px) {
            .main-temp { font-size: 3.5rem; }
            .main-icon { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
        <p>Memuat data satelit...</p>
    </div>

    <div class="app-container">
        <header class="header">
            <div class="greeting">
                <h2 id="greetText">Selamat Pagi,</h2>
                <p>Cek cuaca hari ini yuk!</p>
            </div>
            <div class="date-badge" id="dateBadge">Sen, 25 Nov</div>
        </header>

        <div class="search-bar">
            <button class="btn-icon secondary" onclick="getGeoLocation()"><i class="fas fa-location-crosshairs"></i></button>
            <input type="text" id="cityInput" placeholder="Cari kota (cth: Surabaya)...">
            <button class="btn-icon" onclick="searchCity()"><i class="fas fa-search"></i></button>
        </div>

        <div class="main-card" id="mainCardBg">
            <div class="main-card-header">
                <div class="city-name"><i class="fas fa-map-marker-alt"></i> <span id="cityName">Jakarta</span></div>
                <div class="weather-status" id="weatherDesc">Cerah</div>
            </div>
            
            <div class="main-temp-wrapper">
                <i class="fas fa-sun main-icon" id="mainIcon"></i>
                <span class="main-temp" id="currentTemp">32°</span>
            </div>

            <div class="main-details">
                <div class="detail-item">
                    <i class="fas fa-wind"></i>
                    <span id="windSpeed">10 km/j</span>
                    <small>Angin</small>
                </div>
                <div class="detail-item">
                    <i class="fas fa-tint"></i>
                    <span id="humidity">60%</span> <small>Lembap</small>
                </div>
                <div class="detail-item">
                    <i class="fas fa-sun"></i>
                    <span id="uvIndex">Tinggi</span> <small>UV</small>
                </div>
            </div>
        </div>

        <div>
            <div class="section-title"><i class="far fa-clock"></i> Cuaca Per Jam</div>
            <div class="hourly-scroll" id="hourlyList">
                </div>
        </div>

        <div>
            <div class="section-title"><i class="far fa-calendar-alt"></i> 7 Hari Kedepan</div>
            <div class="daily-list" id="dailyList">
                </div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="day-row" style="flex-direction: column; align-items: flex-start; gap:5px;">
                <small style="color:var(--text-sec)">Terbit</small>
                <div style="font-size:1.2rem; font-weight:600;"><i class="fas fa-sun" style="color: gold; margin-right:5px;"></i> <span id="sunriseTime">--:--</span></div>
            </div>
            <div class="day-row" style="flex-direction: column; align-items: flex-start; gap:5px;">
                <small style="color:var(--text-sec)">Terbenam</small>
                <div style="font-size:1.2rem; font-weight:600;"><i class="fas fa-moon" style="color: slateblue; margin-right:5px;"></i> <span id="sunsetTime">--:--</span></div>
            </div>
        </div>

        <button id="installBtn"><i class="fas fa-download"></i> Install Aplikasi</button>
        <div style="height: 20px;"></div> </div>

    <script>
        // --- 1. INISIALISASI ---
        const daysID = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        
        window.onload = () => {
            setGreeting();
            updateDate();
            // Default load Jakarta
            getWeather(-6.2088, 106.8456, "Jakarta", "DKI Jakarta");
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js');
            }
        };

        // --- 2. LOGIKA UTAMA: FETCH DATA ---
        async function searchCity() {
            const query = document.getElementById('cityInput').value;
            if(!query) return;
            
            toggleLoader(true);
            try {
                // GeoCoding
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${query}&count=1&language=id&format=json`);
                const geoData = await geoRes.json();
                
                if(!geoData.results) throw new Error("Kota tidak ditemukan");
                
                const loc = geoData.results[0];
                await getWeather(loc.latitude, loc.longitude, loc.name, loc.admin1);
                
            } catch(e) {
                alert(e.message);
                toggleLoader(false);
            }
        }

        async function getWeather(lat, lon, cityName, region) {
            try {
                // Request Semua Data Sekaligus (Current, Hourly, Daily)
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,weathercode&daily=weathercode,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto`;
                
                const res = await fetch(url);
                const data = await res.json();
                
                renderCurrent(data.current_weather, cityName);
                renderHourly(data.hourly);
                renderDaily(data.daily);
                
                toggleLoader(false);
            } catch(e) {
                console.error(e);
                alert("Gagal mengambil data cuaca");
                toggleLoader(false);
            }
        }

        // --- 3. RENDER UI FUNCTIONS ---

        function renderCurrent(current, name) {
            const ui = getWeatherUI(current.weathercode);
            
            document.getElementById('cityName').innerText = name;
            document.getElementById('currentTemp').innerText = Math.round(current.temperature) + "°";
            document.getElementById('weatherDesc').innerText = ui.label;
            document.getElementById('windSpeed').innerText = current.windspeed + " km/j";
            
            // Icon & Background
            const iconEl = document.getElementById('mainIcon');
            iconEl.className = `main-icon ${ui.icon}`;
            
            // Ganti warna kartu utama berdasarkan cuaca
            const card = document.getElementById('mainCardBg');
            card.style.background = ui.gradient;
            
            // Simulasi data yang tidak ada di Open-Meteo Current
            document.getElementById('humidity').innerText = (50 + Math.floor(Math.random() * 40)) + "%"; 
        }

        function renderHourly(hourly) {
            const list = document.getElementById('hourlyList');
            list.innerHTML = ''; // Reset
            
            const now = new Date();
            const currentHour = now.getHours();
            
            // Ambil 24 jam ke depan
            for(let i = 0; i < 24; i++) {
                // Cari index waktu di array API yang cocok dengan jam sekarang + i
                // API Open Meteo hourly start from 00:00 today.
                // Logika simpel: ambil index jam sekarang + i
                const dataIndex = currentHour + i;
                if(dataIndex >= hourly.time.length) break;

                const temp = Math.round(hourly.temperature_2m[dataIndex]);
                const code = hourly.weathercode[dataIndex];
                const timeString = hourly.time[dataIndex]; // ISO String
                const dateObj = new Date(timeString);
                const hourLabel = i === 0 ? 'Sekarang' : dateObj.getHours() + ":00";
                
                const ui = getWeatherUI(code);
                
                const item = document.createElement('div');
                item.className = `hour-card ${i === 0 ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="hour-time">${hourLabel}</div>
                    <i class="${ui.icon} hour-icon"></i>
                    <div class="hour-temp">${temp}°</div>
                `;
                list.appendChild(item);
            }
        }

        function renderDaily(daily) {
            const list = document.getElementById('dailyList');
            list.innerHTML = '';
            
            // Update Sunrise/Sunset hari ini
            document.getElementById('sunriseTime').innerText = daily.sunrise[0].slice(-5);
            document.getElementById('sunsetTime').innerText = daily.sunset[0].slice(-5);

            for(let i = 0; i < 7; i++) { // 7 Hari
                const max = Math.round(daily.temperature_2m_max[i]);
                const min = Math.round(daily.temperature_2m_min[i]);
                const code = daily.weathercode[i];
                const date = new Date(daily.time[i]);
                const dayName = i === 0 ? 'Hari Ini' : daysID[date.getDay()];
                
                const ui = getWeatherUI(code);
                
                const item = document.createElement('div');
                item.className = 'day-row';
                item.innerHTML = `
                    <div class="day-name">${dayName}</div>
                    <div class="day-icon"><i class="${ui.icon}"></i></div>
                    <div class="day-temp"><span>${max}°</span> <small>${min}°</small></div>
                `;
                list.appendChild(item);
            }
        }

        // --- 4. HELPER: ICON & COLOR ---
        function getWeatherUI(code) {
            // WMO Weather Codes
            if(code === 0) return { label: "Cerah", icon: "fas fa-sun", gradient: "linear-gradient(135deg, #fceabb 0%, #f8b500 100%)" };
            if([1,2,3].includes(code)) return { label: "Berawan", icon: "fas fa-cloud-sun", gradient: "linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)" };
            if([45,48].includes(code)) return { label: "Kabut", icon: "fas fa-smog", gradient: "linear-gradient(135deg, #606c88 0%, #3f4c6b 100%)" };
            if([51,53,55,61,63,65,80,81,82].includes(code)) return { label: "Hujan", icon: "fas fa-cloud-showers-heavy", gradient: "linear-gradient(135deg, #2c3e50 0%, #3498db 100%)" };
            if([95,96,99].includes(code)) return { label: "Badai", icon: "fas fa-bolt", gradient: "linear-gradient(135deg, #141e30 0%, #243b55 100%)" };
            
            return { label: "Mendung", icon: "fas fa-cloud", gradient: "linear-gradient(135deg, #757f9a 0%, #d7dde8 100%)" };
        }

        // --- 5. SYSTEM UTILS ---
        function getGeoLocation() {
            if(!navigator.geolocation) return alert("GPS tidak didukung");
            toggleLoader(true);
            navigator.geolocation.getCurrentPosition(async pos => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                // Reverse Geo untuk nama kota
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const json = await res.json();
                    const city = json.address.city || json.address.town || json.address.county;
                    await getWeather(lat, lon, city, "GPS");
                } catch(e) {
                    await getWeather(lat, lon, "Lokasi Saya", "GPS");
                }
            }, () => {
                alert("Izin lokasi ditolak");
                toggleLoader(false);
            });
        }

        function setGreeting() {
            const hour = new Date().getHours();
            let text = "Selamat Pagi,";
            if(hour >= 10) text = "Selamat Siang,";
            if(hour >= 15) text = "Selamat Sore,";
            if(hour >= 19) text = "Selamat Malam,";
            document.getElementById('greetText').innerText = text;
        }

        function updateDate() {
            const now = new Date();
            const str = now.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
            document.getElementById('dateBadge').innerText = str;
        }

        function toggleLoader(show) {
            document.getElementById('loader').style.opacity = show ? '1' : '0';
            setTimeout(() => {
                document.getElementById('loader').style.display = show ? 'flex' : 'none';
            }, 500);
        }

        // Search on Enter
        document.getElementById('cityInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchCity();
        });
        
        // PWA Install Prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            const btn = document.getElementById('installBtn');
            btn.style.display = 'block';
            btn.addEventListener('click', () => {
                e.prompt();
                btn.style.display = 'none';
            });
        });
    </script>
</body>
</html>
