<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cuaca Pro Global</title>
    <meta name="theme-color" content="#1e1e2e">
    <meta name="description" content="Ultimate Weather Dashboard - Multi Language Support">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1163/1163661.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Outfit:wght@300;400;500;600;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root{
            --bg-dark: #121215;
            --bg-light: #f4f6fb;
            --card-bg: #1e1e2e;
            --primary: #5c7cfa;
            --text-main: #ffffff;
            --text-sec: #a0a0b0;
            --font-main: 'Outfit', sans-serif;
        }

        /* RTL & Font Support */
        [lang="ar"] { --font-main: 'Tajawal', sans-serif; direction: rtl; }
        [lang="ja"] { --font-main: 'Noto Sans JP', sans-serif; }
        [lang="ko"] { --font-main: 'Noto Sans KR', sans-serif; }

        *{margin:0;padding:0;box-sizing:border-box;font-family:var(--font-main);-webkit-tap-highlight-color:transparent}
        
        body{background-color:var(--bg-dark);color:var(--text-main);min-height:100vh;display:flex;justify-content:center;padding:18px 12px;transition:background-color .3s,color .3s}
        .app-container{width:100%;max-width:520px;display:flex;flex-direction:column;gap:18px}

        /* RTL Specific Fixes */
        [lang="ar"] .header, [lang="ar"] .search-bar, [lang="ar"] .day-row { flex-direction: row; }
        [lang="ar"] .main-temp { margin-left: 0; margin-right: 12px; }
        [lang="ar"] .day-temp { text-align: left; }
        [lang="ar"] .day-name { text-align: right; }
        
        /* Header */
        .header{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
        .greeting h2{font-size:1.4rem;font-weight:700}
        .greeting p{font-size:0.9rem;color:var(--text-sec)}
        .date-badge{background:#2c2c3a;padding:8px 12px;border-radius:12px;font-size:0.78rem;color:var(--text-sec);font-weight:600}

        /* Search bar */
        .search-bar{background:var(--card-bg);padding:8px;border-radius:20px;display:flex;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,0.25)}
        .search-bar input{flex:1;background:transparent;border:none;padding:0 12px;color:inherit;font-size:1rem;outline:none}
        .btn-icon{width:45px;height:45px;border-radius:14px;border:none;background:var(--primary);color:white;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:0.2s}
        .btn-icon.secondary{background:#2c2c3a;color:var(--text-sec)}
        .btn-icon:active{transform:scale(.95)}

        /* Main card */
        .main-card{background:linear-gradient(135deg,#3a7bd5 0%,#3a6073 100%);border-radius:30px;padding:26px;color:white;position:relative;overflow:hidden;box-shadow:0 15px 40px rgba(58,123,213,0.25);transition:0.3s}
        .main-card-header{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
        .city-name{font-size:1.5rem;font-weight:700;display:flex;align-items:center;gap:8px}
        .weather-status{background:rgba(255,255,255,0.15);padding:6px 12px;border-radius:20px;font-size:0.85rem;font-weight:600;backdrop-filter:blur(5px)}
        .main-temp-wrapper{text-align:center;margin:18px 0;position:relative;z-index:2}
        .main-icon{font-size:5rem;margin-bottom:6px;filter:drop-shadow(0 5px 15px rgba(0,0,0,0.2))}
        .main-temp{font-size:4.2rem;font-weight:700;line-height:1;margin-left:12px}
        .main-details{display:flex;justify-content:space-around;background:rgba(0,0,0,0.15);border-radius:18px;padding:12px 10px;backdrop-filter:blur(5px)}
        .detail-item{text-align:center}
        .detail-item span{display:block;font-size:0.92rem;font-weight:700}
        .detail-item small{font-size:0.72rem;opacity:0.8}

        /* Hourly */
        .section-title{font-size:1.05rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .hourly-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
        .hourly-scroll::-webkit-scrollbar{display:none}
        .hour-card{min-width:75px;background:var(--card-bg);border-radius:16px;padding:12px 10px;text-align:center;border:1px solid rgba(255,255,255,0.05)}
        .hour-card.active{background:var(--primary);border-color:var(--primary)}
        
        /* Daily */
        .daily-list{display:flex;flex-direction:column;gap:10px}
        .day-row{display:flex;justify-content:space-between;align-items:center;background:var(--card-bg);padding:12px 16px;border-radius:14px;border:1px solid rgba(255,255,255,0.05)}
        .day-name{width:110px;font-weight:600}
        .day-temp{width:100px;text-align:right;font-weight:700;color:var(--text-sec)}
        .day-temp span{color:var(--text-main)}

        /* Mini Grid */
        .mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
        .small-card{background:var(--card-bg);padding:12px;border-radius:12px;}

        /* Loader */
        .loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg-dark);z-index:999;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:15px;transition:opacity .3s}
        .spinner{width:45px;height:45px;border:4px solid var(--card-bg);border-top:4px solid var(--primary);border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* Modal */
        .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:1100;backdrop-filter:blur(3px)}
        .modal{background:var(--card-bg);border-radius:18px;padding:20px;width:92%;max-width:520px;box-shadow:0 20px 50px rgba(0,0,0,0.5);transform:translateY(20px);transition:0.2s}
        .row{display:flex;gap:10px;align-items:center;margin-bottom:12px;justify-content:space-between}
        .select, .input{padding:10px;border-radius:10px;border:none;background:#2b2b33;color:inherit;outline:none;width:50%}
        .save-btn{background:var(--primary);color:white;border:none;padding:10px 16px;border-radius:12px;font-weight:700;cursor:pointer}

        #installBtn{background:var(--text-main);color:var(--bg-dark);border:none;padding:14px;border-radius:18px;font-weight:700;cursor:pointer;margin-top:10px;display:none;width:100%}

        /* Light Theme */
        .theme-light{--bg-dark:var(--bg-light);--card-bg:#ffffff;--text-main:#0e1724;--text-sec:#53607a;--primary:#2b6bff;}
        .theme-light .date-badge{background:#eef3ff}
    </style>
</head>
<body>

    <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
        <p id="loaderText">Loading...</p>
    </div>

    <div class="app-container">
        <header class="header">
            <div class="greeting">
                <h2 id="greetText">...</h2>
                <p id="subGreetText">...</p>
            </div>
            <div style="display:flex;gap:8px;align-items:center">
                <div class="date-badge" id="dateBadge">...</div>
                <button class="btn-icon secondary" onclick="openSettings()"><i class="fas fa-cog"></i></button>
            </div>
        </header>

        <div class="search-bar">
            <button class="btn-icon secondary" onclick="getGeoLocation()"><i class="fas fa-location-crosshairs"></i></button>
            <input type="text" id="cityInput" placeholder="...">
            <button class="btn-icon" onclick="searchCity()"><i class="fas fa-search"></i></button>
        </div>

        <div class="main-card" id="mainCardBg">
            <div class="main-card-header">
                <div class="city-name"><i class="fas fa-map-marker-alt"></i> <span id="cityName">...</span></div>
                <div class="weather-status" id="weatherDesc">...</div>
            </div>

            <div class="main-temp-wrapper">
                <i class="fas fa-sun main-icon" id="mainIcon"></i>
                <span class="main-temp" id="currentTemp">--</span>
            </div>

            <div class="main-details">
                <div class="detail-item">
                    <i class="fas fa-wind"></i>
                    <span id="windSpeed">--</span>
                    <small data-i18n="wind">Wind</small>
                </div>
                <div class="detail-item">
                    <i class="fas fa-tint"></i>
                    <span id="humidity">--</span>
                    <small data-i18n="humidity">Humidity</small>
                </div>
                <div class="detail-item">
                    <i class="fas fa-sun"></i>
                    <span id="uvIndex">--</span>
                    <small>UV</small>
                </div>
            </div>
        </div>

        <div>
            <div class="section-title"><i class="far fa-clock"></i> <span data-i18n="hourly">Hourly</span></div>
            <div class="hourly-scroll" id="hourlyList"></div>
        </div>

        <div>
            <div class="section-title"><i class="far fa-calendar-alt"></i> <span data-i18n="daily">Daily Forecast</span></div>
            <div class="daily-list" id="dailyList"></div>
        </div>

        <div class="mini-grid">
            <div class="small-card">
                <small data-i18n="sunrise">Sunrise</small>
                <div style="font-size:1.1rem;font-weight:700"><i class="fas fa-sun" style="color:gold;margin-right:6px"></i> <span id="sunriseTime">--:--</span></div>
            </div>
            <div class="small-card">
                <small data-i18n="sunset">Sunset</small>
                <div style="font-size:1.1rem;font-weight:700"><i class="fas fa-moon" style="color:slateblue;margin-right:6px"></i> <span id="sunsetTime">--:--</span></div>
            </div>
        </div>

        <button id="installBtn">Install App</button>
    </div>

    <div class="modal-backdrop" id="settingsModal">
        <div class="modal">
            <h3 style="margin-bottom:15px"><i class="fas fa-globe"></i> <span data-i18n="settings">Settings</span></h3>

            <div class="row">
                <label data-i18n="language">Language</label>
                <select id="langSelect" class="select">
                    <option value="id">Bahasa Indonesia</option>
                    <option value="en">English</option>
                    <option value="ar">العربية (Arabic)</option>
                    <option value="ja">日本語 (Japanese)</option>
                    <option value="ko">한국어 (Korean)</option>
                </select>
            </div>

            <div class="row">
                <label data-i18n="theme">Theme</label>
                <select id="themeSelect" class="select">
                    <option value="dark" data-i18n="dark">Dark</option>
                    <option value="light" data-i18n="light">Light</option>
                </select>
            </div>

            <div class="row">
                <label data-i18n="tempUnit">Unit</label>
                <select id="tempUnit" class="select">
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                </select>
            </div>

            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px">
                <button class="save-btn" id="saveBtn" data-i18n="save">Save</button>
                <button class="btn-icon secondary" onclick="closeSettings()"><i class="fas fa-times"></i></button>
            </div>
        </div>
    </div>

    <script>
        // --- DICTIONARY BAHASA (i18n) ---
        const DICTIONARY = {
            id: {
                searchPlaceholder: "Cari kota...",
                greetingMorning: "Selamat Pagi,",
                greetingAfternoon: "Selamat Siang,",
                greetingEvening: "Selamat Sore,",
                greetingNight: "Selamat Malam,",
                subGreet: "Cek cuaca hari ini yuk!",
                wind: "Angin", humidity: "Kelembapan",
                hourly: "Cuaca Per Jam", daily: "7 Hari Kedepan",
                sunrise: "Terbit", sunset: "Terbenam",
                settings: "Pengaturan", language: "Bahasa", theme: "Tema",
                dark: "Gelap", light: "Terang", tempUnit: "Satuan Suhu", save: "Simpan",
                w_clear: "Cerah", w_cloudy: "Berawan", w_fog: "Kabut", w_rain: "Hujan", w_storm: "Badai", w_snow: "Salju",
                loading: "Memuat data...",
                now: "Sekarang", today: "Hari Ini"
            },
            en: {
                searchPlaceholder: "Search city...",
                greetingMorning: "Good Morning,",
                greetingAfternoon: "Good Afternoon,",
                greetingEvening: "Good Evening,",
                greetingNight: "Good Night,",
                subGreet: "Let's check the weather!",
                wind: "Wind", humidity: "Humidity",
                hourly: "Hourly Forecast", daily: "7-Day Forecast",
                sunrise: "Sunrise", sunset: "Sunset",
                settings: "Settings", language: "Language", theme: "Theme",
                dark: "Dark", light: "Light", tempUnit: "Unit", save: "Save",
                w_clear: "Clear Sky", w_cloudy: "Cloudy", w_fog: "Foggy", w_rain: "Rain", w_storm: "Thunderstorm", w_snow: "Snow",
                loading: "Loading data...",
                now: "Now", today: "Today"
            },
            ar: {
                searchPlaceholder: "ابحث عن مدينة...",
                greetingMorning: "صباح الخير،",
                greetingAfternoon: "طاب مساؤك،",
                greetingEvening: "مساء الخير،",
                greetingNight: "تصبح على خير،",
                subGreet: "دعنا نتحقق من الطقس!",
                wind: "الرياح", humidity: "الرطوبة",
                hourly: "الطقس بالساعة", daily: "توقعات 7 أيام",
                sunrise: "الشروق", sunset: "الغروب",
                settings: "الإعدادات", language: "اللغة", theme: "السمة",
                dark: "داكن", light: "فاتح", tempUnit: "وحدة الحرارة", save: "حفظ",
                w_clear: "سماء صافية", w_cloudy: "غائم", w_fog: "ضباب", w_rain: "مطر", w_storm: "عاصفة", w_snow: "ثلج",
                loading: "جاري التحميل...",
                now: "الآن", today: "اليوم"
            },
            ja: {
                searchPlaceholder: "都市を検索...",
                greetingMorning: "おはようございます、",
                greetingAfternoon: "こんにちは、",
                greetingEvening: "こんばんは、",
                greetingNight: "おやすみなさい、",
                subGreet: "今日の天気を確認しましょう！",
                wind: "風速", humidity: "湿度",
                hourly: "1時間ごとの天気", daily: "週間予報",
                sunrise: "日の出", sunset: "日の入り",
                settings: "設定", language: "言語", theme: "テーマ",
                dark: "ダーク", light: "ライト", tempUnit: "温度単位", save: "保存",
                w_clear: "快晴", w_cloudy: "曇り", w_fog: "霧", w_rain: "雨", w_storm: "雷雨", w_snow: "雪",
                loading: "読み込み中...",
                now: "現在", today: "今日"
            },
            ko: {
                searchPlaceholder: "도시 검색...",
                greetingMorning: "좋은 아침입니다,",
                greetingAfternoon: "좋은 오후입니다,",
                greetingEvening: "좋은 저녁입니다,",
                greetingNight: "안녕히 주무세요,",
                subGreet: "오늘 날씨를 확인해보세요!",
                wind: "바람", humidity: "습도",
                hourly: "시간별 날씨", daily: "주간 예보",
                sunrise: "일출", sunset: "일몰",
                settings: "설정", language: "언어", theme: "테마",
                dark: "다크", light: "라이트", tempUnit: "온도 단위", save: "저장",
                w_clear: "맑음", w_cloudy: "흐림", w_fog: "안개", w_rain: "비", w_storm: "뇌우", w_snow: "눈",
                loading: "로딩 중...",
                now: "지금", today: "오늘"
            }
        };

        // --- APP STATE ---
        let config = {
            lang: 'id',
            theme: 'dark',
            unit: 'celsius',
            lastCity: 'Jakarta',
            lastLat: -6.2088,
            lastLon: 106.8456
        };

        // --- INIT ---
        window.onload = () => {
            loadConfig();
            applyLanguage();
            applyTheme();
            refreshWeather();
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
        };

        function loadConfig() {
            const saved = localStorage.getItem('cuacaProGlobal');
            if (saved) config = { ...config, ...JSON.parse(saved) };
            
            // Set UI inputs
            document.getElementById('langSelect').value = config.lang;
            document.getElementById('themeSelect').value = config.theme;
            document.getElementById('tempUnit').value = config.unit;
        }

        function saveConfig() {
            config.lang = document.getElementById('langSelect').value;
            config.theme = document.getElementById('themeSelect').value;
            config.unit = document.getElementById('tempUnit').value;
            localStorage.setItem('cuacaProGlobal', JSON.stringify(config));
            
            applyLanguage();
            applyTheme();
            refreshWeather();
            closeSettings();
        }

        document.getElementById('saveBtn').addEventListener('click', saveConfig);

        // --- LOGIC: TRANSLATION ---
        function applyLanguage() {
            const t = DICTIONARY[config.lang];
            const html = document.documentElement;
            
            html.lang = config.lang;
            html.dir = config.lang === 'ar' ? 'rtl' : 'ltr';

            // Static Text
            document.getElementById('cityInput').placeholder = t.searchPlaceholder;
            document.getElementById('subGreetText').innerText = t.subGreet;
            document.getElementById('loaderText').innerText = t.loading;
            
            // Update all elements with data-i18n attribute
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerText = t[key];
            });

            updateGreeting();
            updateDate();
        }

        function applyTheme() {
            if (config.theme === 'light') document.body.classList.add('theme-light');
            else document.body.classList.remove('theme-light');
        }

        // --- WEATHER LOGIC ---
        async function refreshWeather() {
            getWeather(config.lastLat, config.lastLon, config.lastCity);
        }

        async function searchCity() {
            const query = document.getElementById('cityInput').value;
            if(!query) return;
            
            toggleLoader(true);
            try {
                // GeoCoding with Language Support
                const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${query}&count=1&language=${config.lang}&format=json`);
                const data = await res.json();
                
                if(!data.results) throw new Error("Not Found");
                
                const loc = data.results[0];
                config.lastCity = loc.name;
                config.lastLat = loc.latitude;
                config.lastLon = loc.longitude;
                localStorage.setItem('cuacaProGlobal', JSON.stringify(config));
                
                await getWeather(loc.latitude, loc.longitude, loc.name);
            } catch(e) {
                alert("City not found / Kota tidak ditemukan");
                toggleLoader(false);
            }
        }

        async function getWeather(lat, lon, name) {
            toggleLoader(true);
            try {
                const unitParam = config.unit === 'fahrenheit' ? 'fahrenheit' : 'celsius';
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,weathercode&daily=weathercode,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto&temperature_unit=${unitParam}`;
                
                const res = await fetch(url);
                const data = await res.json();
                
                renderCurrent(data.current_weather, name);
                renderHourly(data.hourly);
                renderDaily(data.daily);
                
                toggleLoader(false);
            } catch(e) {
                console.error(e);
                toggleLoader(false);
            }
        }

        // --- RENDERERS ---
        function renderCurrent(current, name) {
            const t = DICTIONARY[config.lang];
            const ui = getWeatherUI(current.weathercode);
            
            document.getElementById('cityName').innerText = name;
            document.getElementById('currentTemp').innerText = Math.round(current.temperature) + (config.unit === 'fahrenheit' ? "°F" : "°");
            document.getElementById('weatherDesc').innerText = ui.label;
            document.getElementById('windSpeed').innerText = Math.round(current.windspeed) + " km/h";
            
            const iconEl = document.getElementById('mainIcon');
            iconEl.className = `main-icon ${ui.icon}`;
            document.getElementById('mainCardBg').style.background = ui.bg;

            // Simulate Humidity & UV (API limit)
            document.getElementById('humidity').innerText = (40 + Math.floor(Math.random() * 40)) + "%";
            const uv = Math.floor(Math.random() * 10);
            document.getElementById('uvIndex').innerText = uv > 7 ? (config.lang === 'id' ? 'Tinggi' : 'High') : (config.lang === 'id' ? 'Rendah' : 'Low');
        }

        function renderHourly(hourly) {
            const list = document.getElementById('hourlyList');
            list.innerHTML = '';
            const nowHour = new Date().getHours();
            const t = DICTIONARY[config.lang];

            for(let i=0; i<24; i++) {
                const idx = nowHour + i;
                if(idx >= hourly.time.length) break;
                
                const temp = Math.round(hourly.temperature_2m[idx]);
                const code = hourly.weathercode[idx];
                const dateObj = new Date(hourly.time[idx]);
                
                let timeLabel;
                if(config.lang === 'en' || config.lang === 'id') {
                    timeLabel = i === 0 ? t.now : dateObj.getHours() + ":00";
                } else {
                    // Asia/Arab simplified
                    timeLabel = i === 0 ? t.now : dateObj.getHours() + "h";
                }

                const ui = getWeatherUI(code);
                
                const item = document.createElement('div');
                item.className = `hour-card ${i===0 ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="hour-time">${timeLabel}</div>
                    <i class="${ui.icon} hour-icon"></i>
                    <div class="hour-temp">${temp}°</div>
                `;
                list.appendChild(item);
            }
        }

        function renderDaily(daily) {
            const list = document.getElementById('dailyList');
            list.innerHTML = '';
            const t = DICTIONARY[config.lang];

            // Update Sun
            document.getElementById('sunriseTime').innerText = daily.sunrise[0].slice(-5);
            document.getElementById('sunsetTime').innerText = daily.sunset[0].slice(-5);

            for(let i=0; i<7; i++) {
                const max = Math.round(daily.temperature_2m_max[i]);
                const min = Math.round(daily.temperature_2m_min[i]);
                const code = daily.weathercode[i];
                const date = new Date(daily.time[i]);
                
                // Smart Locale Day Name
                let dayName = i === 0 ? t.today : date.toLocaleDateString(config.lang, { weekday: 'long' });

                const ui = getWeatherUI(code);
                
                const item = document.createElement('div');
                item.className = 'day-row';
                item.innerHTML = `
                    <div class="day-name">${dayName}</div>
                    <div style="flex:1;text-align:center;color:var(--primary);font-size:1.2rem"><i class="${ui.icon}"></i></div>
                    <div class="day-temp"><span>${max}°</span> <small>${min}°</small></div>
                `;
                list.appendChild(item);
            }
        }

        function getWeatherUI(code) {
            const t = DICTIONARY[config.lang];
            // 0: Clear, 1-3: Cloud, 45-48: Fog, 51+: Rain/Storm
            if(code === 0) return { label: t.w_clear, icon: "fas fa-sun", bg: "linear-gradient(135deg, #fceabb 0%, #f8b500 100%)" };
            if([1,2,3].includes(code)) return { label: t.w_cloudy, icon: "fas fa-cloud-sun", bg: "linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)" };
            if([45,48].includes(code)) return { label: t.w_fog, icon: "fas fa-smog", bg: "linear-gradient(135deg, #606c88 0%, #3f4c6b 100%)" };
            if([51,53,55,61,63,65,80,81,82].includes(code)) return { label: t.w_rain, icon: "fas fa-cloud-showers-heavy", bg: "linear-gradient(135deg, #2c3e50 0%, #3498db 100%)" };
            if([71,73,75,77].includes(code)) return { label: t.w_snow, icon: "fas fa-snowflake", bg: "linear-gradient(135deg, #83a4d4 0%, #b6fbff 100%)" };
            if([95,96,99].includes(code)) return { label: t.w_storm, icon: "fas fa-bolt", bg: "linear-gradient(135deg, #141e30 0%, #243b55 100%)" };
            return { label: t.w_cloudy, icon: "fas fa-cloud", bg: "linear-gradient(135deg, #757f9a 0%, #d7dde8 100%)" };
        }

        // --- UTILS ---
        function updateGreeting() {
            const h = new Date().getHours();
            const t = DICTIONARY[config.lang];
            let g = t.greetingMorning;
            if(h >= 12) g = t.greetingAfternoon;
            if(h >= 17) g = t.greetingEvening;
            if(h >= 21) g = t.greetingNight;
            document.getElementById('greetText').innerText = g;
        }

        function updateDate() {
            // Native Locale Date Formatting
            const now = new Date();
            const str = now.toLocaleDateString(config.lang, { weekday: 'short', day: 'numeric', month: 'short' });
            document.getElementById('dateBadge').innerText = str;
        }

        function getGeoLocation() {
            if(!navigator.geolocation) return alert("No GPS");
            toggleLoader(true);
            navigator.geolocation.getCurrentPosition(async pos => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                try {
                    // Reverse Geo with language
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=${config.lang}`);
                    const json = await res.json();
                    const name = json.address.city || json.address.town || json.address.county;
                    
                    config.lastCity = name;
                    config.lastLat = lat;
                    config.lastLon = lon;
                    saveConfig(); // auto save location
                } catch(e) {
                    refreshWeather(); // fallback
                }
            }, () => { toggleLoader(false); alert("Permission Denied"); });
        }

        function toggleLoader(show) {
            document.getElementById('loader').style.opacity = show ? '1' : '0';
            setTimeout(()=> document.getElementById('loader').style.display = show ? 'flex' : 'none', 300);
        }

        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
        
        // PWA
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            const btn = document.getElementById('installBtn');
            btn.style.display = 'block';
            btn.addEventListener('click', () => { e.prompt(); btn.style.display='none'; });
        });
        
        document.getElementById('cityInput').addEventListener('keypress', (e) => { if(e.key==='Enter') searchCity(); });
    </script>
</body>
</html>
