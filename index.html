<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuaca ID Dashboard</title>
    <meta name="theme-color" content="#4facfe">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1163/1163661.png">

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ffffff;
            --glass: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --bg-blue: linear-gradient(135deg, #1cb5e0 0%, #000851 100%);
            --bg-rain: linear-gradient(135deg, #232526 0%, #414345 100%);
            --bg-sunny: linear-gradient(135deg, #fceabb 0%, #f8b500 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }

        body {
            min-height: 100vh;
            background: var(--bg-blue);
            color: white;
            padding: 20px;
            display: flex; justify-content: center; align-items: flex-start;
            transition: background 1s ease;
        }

        .dashboard {
            width: 100%; max-width: 500px;
            background: var(--glass);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            margin-top: 10px;
        }

        /* --- Header Section --- */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .date-time h2 { font-size: 1.8rem; font-weight: 700; }
        .date-time p { font-size: 0.9rem; opacity: 0.8; }
        .app-logo { font-size: 1.5rem; background: rgba(255,255,255,0.2); width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }

        /* --- Search Bar --- */
        .search-area { position: relative; display: flex; gap: 10px; margin-bottom: 20px; }
        .search-input {
            width: 100%; padding: 15px 20px; border-radius: 20px; border: none;
            background: rgba(255,255,255,0.2); color: white; font-size: 1rem; outline: none;
            transition: 0.3s;
        }
        .search-input::placeholder { color: rgba(255,255,255,0.6); }
        .search-input:focus { background: rgba(255,255,255,0.3); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .btn-action {
            width: 50px; background: white; color: #333; border: none; border-radius: 18px;
            cursor: pointer; font-size: 1.2rem; transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .btn-action:active { transform: scale(0.9); }

        /* --- Shortcuts --- */
        .shortcuts { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
        .shortcuts::-webkit-scrollbar { display: none; }
        .chip {
            white-space: nowrap; padding: 8px 16px; background: rgba(0,0,0,0.2); border-radius: 20px;
            font-size: 0.85rem; cursor: pointer; border: 1px solid transparent; transition: 0.3s;
        }
        .chip:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); }
        .chip.active { background: white; color: #333; font-weight: 700; }

        /* --- Weather Card (Main) --- */
        .weather-card { text-align: center; margin-bottom: 25px; animation: fadeIn 0.8s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .weather-icon i { font-size: 6rem; margin: 10px 0; text-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .temp-display { font-size: 4.5rem; font-weight: 700; line-height: 1; margin-bottom: 5px; }
        .weather-status { font-size: 1.4rem; font-weight: 500; text-transform: capitalize; margin-bottom: 5px; }
        .location-display { font-size: 0.9rem; opacity: 0.9; background: rgba(255,255,255,0.15); padding: 5px 15px; border-radius: 15px; display: inline-block; }

        /* --- Details Grid --- */
        .details { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .detail-box {
            background: rgba(255,255,255,0.1); padding: 15px; border-radius: 20px;
            display: flex; align-items: center; gap: 15px; border: 1px solid rgba(255,255,255,0.05);
        }
        .detail-icon { width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .detail-info h4 { font-size: 0.75rem; opacity: 0.7; font-weight: 400; }
        .detail-info p { font-size: 1.1rem; font-weight: 700; }

        /* --- Install Button & Loader --- */
        #loader { display: none; text-align: center; margin: 20px 0; font-weight: 600; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }

        .btn-install {
            display: none; width: 100%; padding: 15px; margin-top: 20px;
            background: white; color: #333; border: none; border-radius: 20px;
            font-weight: 700; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .error-msg { background: rgba(255, 71, 87, 0.8); padding: 15px; border-radius: 15px; text-align: center; display: none; margin-bottom: 20px; font-size: 0.9rem; }
    </style>
</head>
<body onload="initApp()">

    <div class="dashboard">
        <div class="header">
            <div class="date-time">
                <h2 id="clock">00:00</h2>
                <p id="date">Memuat tanggal...</p>
            </div>
            <div class="app-logo"><i class="fas fa-cloud-sun-rain"></i></div>
        </div>

        <div class="search-area">
            <input type="text" id="cityInput" class="search-input" placeholder="Cari kota (mis: Bogor)...">
            <button class="btn-action" onclick="searchWeather()"><i class="fas fa-search"></i></button>
            <button class="btn-action" onclick="getGeoLocation()" style="background: rgba(255,255,255,0.25); color: white;"><i class="fas fa-location-arrow"></i></button>
        </div>

        <div class="shortcuts">
            <div class="chip active" onclick="quickSearch('Jakarta')">Jakarta</div>
            <div class="chip" onclick="quickSearch('Bandung')">Bandung</div>
            <div class="chip" onclick="quickSearch('Surabaya')">Surabaya</div>
            <div class="chip" onclick="quickSearch('Yogyakarta')">Jogja</div>
            <div class="chip" onclick="quickSearch('Bali')">Bali</div>
            <div class="chip" onclick="quickSearch('Medan')">Medan</div>
        </div>

        <div id="loader">🔄 Sedang mengambil data...</div>
        <div id="errorBox" class="error-msg"></div>

        <div id="weatherContent">
            <div class="weather-card">
                <div class="location-display"><i class="fas fa-map-marker-alt"></i> <span id="locName">-</span></div>
                <div class="weather-icon" id="weatherIcon"><i class="fas fa-cloud"></i></div>
                <div class="temp-display" id="tempValue">0°</div>
                <div class="weather-status" id="weatherDesc">Siap...</div>
                <small style="opacity: 0.6">Update: <span id="updateTime">-</span></small>
            </div>

            <div class="details">
                <div class="detail-box">
                    <div class="detail-icon"><i class="fas fa-tint"></i></div>
                    <div class="detail-info"><h4>Kelembapan</h4><p id="humidity">0%</p></div>
                </div>
                <div class="detail-box">
                    <div class="detail-icon"><i class="fas fa-wind"></i></div>
                    <div class="detail-info"><h4>Angin</h4><p id="windSpeed">0 km/j</p></div>
                </div>
                <div class="detail-box">
                    <div class="detail-icon"><i class="fas fa-eye"></i></div>
                    <div class="detail-info"><h4>Jarak</h4><p id="visibility">0 km</p></div>
                </div>
                <div class="detail-box">
                    <div class="detail-icon"><i class="fas fa-compass"></i></div>
                    <div class="detail-info"><h4>Arah</h4><p id="windDir">-</p></div>
                </div>
            </div>
            
            <a href="#" id="bmkgLink" target="_blank" style="display:block; text-align:center; margin-top:20px; color:white; font-size:0.8rem; text-decoration:none; opacity:0.5;">Sumber Data: BMKG Indonesia</a>
        </div>

        <button id="installBtn" class="btn-install"><i class="fas fa-download"></i> Install Aplikasi</button>
    </div>

    <script>
        // --- KONFIGURASI API ---
        const API_URL = 'https://api.ootaizumi.web.id/lokasi/cuaca?lokasi=';

        // 1. FUNGSI STARTUP (Jalan saat dibuka)
        function initApp() {
            startTime(); // Jalankan Jam
            quickSearch('Jakarta'); // Load Default Kota
            
            // PWA Register
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js');
            }
        }

        // 2. JAM DIGITAL
        function startTime() {
            const today = new Date();
            let h = today.getHours();
            let m = today.getMinutes();
            h = h < 10 ? '0' + h : h;
            m = m < 10 ? '0' + m : m;
            document.getElementById('clock').innerHTML = h + ":" + m;
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').innerHTML = today.toLocaleDateString('id-ID', options);
            setTimeout(startTime, 1000);
        }

        // 3. PENCARIAN CEPAT (Shortcut)
        function quickSearch(city) {
            document.getElementById('cityInput').value = city;
            // Update UI Chip active
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            searchWeather();
        }

        // 4. FUNGSI CARI CUACA (Main Logic)
        async function searchWeather(queryOverride = null) {
            const inputVal = document.getElementById('cityInput').value;
            const query = queryOverride || inputVal;

            if (!query) return;

            // UI State: Loading
            const loader = document.getElementById('loader');
            const content = document.getElementById('weatherContent');
            const errorBox = document.getElementById('errorBox');
            
            loader.style.display = 'block';
            content.style.opacity = '0.5';
            errorBox.style.display = 'none';

            try {
                // Fetch Data
                const response = await fetch(API_URL + encodeURIComponent(query));
                const data = await response.json();

                // Validasi Response
                if (!data.status) {
                    throw new Error("Kota tidak ditemukan atau server sedang sibuk.");
                }

                // Render Data
                renderData(data.result);
                
                loader.style.display = 'none';
                content.style.opacity = '1';

            } catch (err) {
                loader.style.display = 'none';
                content.style.opacity = '1';
                errorBox.innerHTML = `⚠️ <b>Gagal:</b> ${err.message}`;
                errorBox.style.display = 'block';
            }
        }

        // 5. RENDER DATA KE HTML
        function renderData(data) {
            const w = data.cuaca;
            const loc = data.lokasi;

            document.getElementById('locName').innerText = `${data.namaTempat}, ${loc.provinsi}`;
            document.getElementById('tempValue').innerText = w.suhu;
            document.getElementById('weatherDesc').innerText = w.deskripsi;
            document.getElementById('updateTime').innerText = w.waktu;
            document.getElementById('humidity').innerText = w.kelembapan;
            document.getElementById('windSpeed').innerText = w.angin.kecepatan;
            document.getElementById('windDir').innerText = w.angin.dari;
            document.getElementById('visibility').innerText = w.jarakPandang.teks;
            document.getElementById('bmkgLink').href = data.url.bmkg;

            updateIconAndTheme(w.deskripsi);
        }

        // 6. GANTI ICON & TEMA WARNA
        function updateIconAndTheme(desc) {
            const iconEl = document.querySelector('#weatherIcon i');
            const d = desc.toLowerCase();
            const body = document.body;

            iconEl.className = 'fas'; // Reset class

            // Logika Ikon & Background
            if (d.includes('hujan') || d.includes('petir')) {
                iconEl.classList.add(d.includes('petir') ? 'fa-bolt' : 'fa-cloud-showers-heavy');
                body.style.background = 'var(--bg-rain)';
            } else if (d.includes('cerah') || d.includes('panas')) {
                iconEl.classList.add('fa-sun');
                body.style.background = 'var(--bg-sunny)';
            } else if (d.includes('berawan') || d.includes('mendung')) {
                iconEl.classList.add('fa-cloud');
                body.style.background = 'var(--bg-blue)'; // Default
            } else {
                iconEl.classList.add('fa-cloud-sun');
                body.style.background = 'var(--bg-blue)';
            }
        }

        // 7. GEOLOCATION (GPS)
        function getGeoLocation() {
            const errorBox = document.getElementById('errorBox');
            if (!navigator.geolocation) {
                errorBox.innerText = "Browser tidak mendukung GPS.";
                errorBox.style.display = 'block';
                return;
            }

            document.getElementById('loader').innerText = "📍 Mencari lokasi...";
            document.getElementById('loader').style.display = 'block';

            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const json = await res.json();
                    
                    // Ambil nama kota dari hasil GPS
                    let city = json.address.city || json.address.town || json.address.village || json.address.county;
                    city = city.replace(/(Kota|Kabupaten)\s/i, ''); // Bersihkan nama

                    document.getElementById('cityInput').value = city;
                    document.getElementById('loader').innerText = "🔄 Mengambil data cuaca...";
                    searchWeather(city);

                } catch (e) {
                    errorBox.innerText = "Gagal mendeteksi nama kota.";
                    errorBox.style.display = 'block';
                    document.getElementById('loader').style.display = 'none';
                }
            }, (err) => {
                errorBox.innerHTML = "<b>Gagal GPS:</b> Pastikan HTTPS aktif dan Izin Lokasi diberikan.";
                errorBox.style.display = 'block';
                document.getElementById('loader').style.display = 'none';
            });
        }

        // 8. LOGIKA INSTALL PWA
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            const btn = document.getElementById('installBtn');
            btn.style.display = 'block';
            btn.addEventListener('click', () => {
                btn.style.display = 'none';
                e.prompt();
            });
        });
        
        // Enter Key Listener
        document.getElementById("cityInput").addEventListener("keyup", (e) => {
            if (e.key === "Enter") searchWeather();
        });
    </script>
</body>
</html>
