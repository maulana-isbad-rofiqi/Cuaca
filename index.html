<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuaca ID Pro</title>
    <meta name="theme-color" content="#4facfe">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1163/1163661.png">

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.2);
            --glass-border: rgba(255, 255, 255, 0.3);
            --bg-default: linear-gradient(135deg, #00c6fb 0%, #005bea 100%);
            --bg-rain: linear-gradient(135deg, #3a3e47 0%, #2b32b2 100%);
            --bg-sun: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
            --bg-cloud: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }

        body {
            min-height: 100vh;
            background: var(--bg-default);
            color: white;
            display: flex; justify-content: center; align-items: flex-start;
            padding: 20px;
            transition: background 0.8s ease;
        }

        .container {
            width: 100%; max-width: 480px;
            background: var(--glass);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        /* --- Header --- */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .time-box h1 { font-size: 2rem; font-weight: 700; line-height: 1; }
        .time-box p { font-size: 0.9rem; opacity: 0.9; margin-top: 5px; }
        .logo-box { width: 45px; height: 45px; background: rgba(255,255,255,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

        /* --- Search --- */
        .search-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .input-group { position: relative; flex: 1; }
        .input-group input {
            width: 100%; padding: 15px 20px; border-radius: 20px; border: none; outline: none;
            background: rgba(255,255,255,0.25); color: white; font-size: 1rem;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); transition: 0.3s;
        }
        .input-group input::placeholder { color: rgba(255,255,255,0.7); }
        .input-group input:focus { background: rgba(255,255,255,0.35); }
        
        .btn-icon {
            width: 50px; border: none; border-radius: 20px; background: white; color: #333;
            font-size: 1.2rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .btn-icon:active { transform: scale(0.95); }

        /* --- Shortcuts --- */
        .shortcuts { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 20px; scrollbar-width: none; }
        .shortcuts::-webkit-scrollbar { display: none; }
        .tag { padding: 8px 16px; background: rgba(0,0,0,0.15); border-radius: 50px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; border: 1px solid transparent; transition: 0.3s; }
        .tag:hover { background: rgba(255,255,255,0.2); }
        .tag.active { background: white; color: #333; font-weight: 700; }

        /* --- Main Weather --- */
        .main-weather { text-align: center; margin: 30px 0; animation: float 6s infinite ease-in-out; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .weather-icon { font-size: 6rem; margin-bottom: 10px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3)); }
        .temp { font-size: 5rem; font-weight: 700; line-height: 1; text-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .desc { font-size: 1.5rem; font-weight: 500; text-transform: capitalize; margin-top: 5px; }
        .city-badge { display: inline-block; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 15px; margin-top: 10px; font-size: 0.9rem; }

        /* --- Details Grid --- */
        .grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        .card { background: rgba(255,255,255,0.15); padding: 15px; border-radius: 20px; display: flex; align-items: center; gap: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .card i { font-size: 1.5rem; opacity: 0.8; }
        .card div h4 { font-size: 0.7rem; opacity: 0.7; font-weight: 400; text-transform: uppercase; }
        .card div p { font-size: 1.1rem; font-weight: 700; }

        /* --- Messages --- */
        #loader { display: none; text-align: center; margin: 20px; font-weight: 600; }
        #errorMsg { display: none; background: rgba(255, 71, 87, 0.9); padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3); }

        /* --- Install Button --- */
        #installBtn { display: none; width: 100%; padding: 15px; margin-top: 30px; background: white; color: #333; border: none; border-radius: 20px; font-weight: 700; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        footer { text-align: center; margin-top: 30px; font-size: 0.75rem; opacity: 0.6; }
    </style>
</head>
<body onload="initApp()">

    <div class="container">
        <header>
            <div class="time-box">
                <h1 id="clock">00:00</h1>
                <p id="date">Memuat tanggal...</p>
            </div>
            <div class="logo-box"><i class="fas fa-cloud-moon"></i></div>
        </header>

        <div class="search-container">
            <div class="input-group">
                <input type="text" id="cityInput" placeholder="Cari kota (cth: Pamekasan)...">
            </div>
            <button class="btn-icon" onclick="searchWeather()"><i class="fas fa-search"></i></button>
            <button class="btn-icon" onclick="getGeoLocation()" style="background: rgba(255,255,255,0.3); color: white;"><i class="fas fa-location-crosshairs"></i></button>
        </div>

        <div class="shortcuts">
            <div class="tag active" onclick="quickSearch('Jakarta')">Jakarta</div>
            <div class="tag" onclick="quickSearch('Pamekasan')">Pamekasan</div>
            <div class="tag" onclick="quickSearch('Surabaya')">Surabaya</div>
            <div class="tag" onclick="quickSearch('Bandung')">Bandung</div>
            <div class="tag" onclick="quickSearch('Makassar')">Makassar</div>
        </div>

        <div id="loader"><i class="fas fa-spinner fa-spin"></i> Mengambil data...</div>
        <div id="errorMsg"></div>

        <div id="weatherContent">
            <div class="main-weather">
                <div class="weather-icon" id="icon"><i class="fas fa-cloud"></i></div>
                <div class="temp" id="temp">0°</div>
                <div class="desc" id="desc">Siap...</div>
                <div class="city-badge"><i class="fas fa-map-marker-alt"></i> <span id="locName">-</span></div>
            </div>

            <div class="grid-info">
                <div class="card">
                    <i class="fas fa-wind"></i>
                    <div><h4>Angin</h4><p id="wind">0 km/j</p></div>
                </div>
                <div class="card">
                    <i class="fas fa-compass"></i>
                    <div><h4>Arah</h4><p id="windDir">-</p></div>
                </div>
                <div class="card">
                    <i class="fas fa-arrows-up-down"></i>
                    <div><h4>Elevasi</h4><p id="elevation">0 m</p></div>
                </div>
                <div class="card">
                    <i class="fas fa-clock"></i>
                    <div><h4>Zona</h4><p id="timezone">WIB</p></div>
                </div>
            </div>
        </div>

        <button id="installBtn"><i class="fas fa-download"></i> Install App</button>

        <footer>
            Powered by Open-Meteo &copy; 2025
        </footer>
    </div>

    <script>
        // --- INIT ---
        function initApp() {
            updateClock();
            quickSearch('Jakarta'); // Default City
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js');
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('date').innerText = now.toLocaleDateString('id-ID', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
            setTimeout(updateClock, 1000);
        }

        // --- CORE LOGIC ---
        function quickSearch(city) {
            document.getElementById('cityInput').value = city;
            document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            searchWeather();
        }

        document.getElementById("cityInput").addEventListener("keyup", (e) => {
            if (e.key === "Enter") searchWeather();
        });

        async function searchWeather(queryOverride = null) {
            const city = queryOverride || document.getElementById('cityInput').value;
            if (!city) return;

            const loader = document.getElementById('loader');
            const errorMsg = document.getElementById('errorMsg');
            const content = document.getElementById('weatherContent');

            loader.style.display = 'block';
            errorMsg.style.display = 'none';
            content.style.opacity = '0.3';

            try {
                // 1. GEOCODING (Cari Lat/Long dari Nama Kota)
                // Menggunakan API Open-Meteo Geocoding (Gratis)
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1&language=id&format=json`);
                const geoData = await geoRes.json();

                if (!geoData.results || geoData.results.length === 0) {
                    throw new Error("Kota tidak ditemukan di database.");
                }

                const location = geoData.results[0];
                const lat = location.latitude;
                const lon = location.longitude;
                const name = location.name;
                const admin = location.admin1 || location.country; // Provinsi atau Negara

                // 2. WEATHER FETCH (Ambil cuaca berdasarkan Lat/Long)
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&windspeed_unit=kmh&timezone=auto`);
                const weatherData = await weatherRes.json();

                renderUI(weatherData.current_weather, name, admin, location.elevation, weatherData.utc_offset_seconds);
                
                loader.style.display = 'none';
                content.style.opacity = '1';

            } catch (err) {
                loader.style.display = 'none';
                content.style.opacity = '1';
                errorMsg.innerHTML = `⚠️ ${err.message}`;
                errorMsg.style.display = 'block';
            }
        }

        function renderUI(data, city, admin, elevation, offset) {
            document.getElementById('locName').innerText = `${city}, ${admin}`;
            document.getElementById('temp').innerText = Math.round(data.temperature) + "°";
            document.getElementById('wind').innerText = data.windspeed + " km/j";
            document.getElementById('windDir').innerText = getWindDir(data.winddirection);
            document.getElementById('elevation').innerText = (elevation || 10) + " mdpl";
            
            // Timezone logic simpel
            const offsetHours = offset / 3600;
            let zone = "WIB";
            if(offsetHours === 8) zone = "WITA";
            if(offsetHours === 9) zone = "WIT";
            document.getElementById('timezone').innerText = zone;

            // WMO Code Interpretation
            const code = data.weathercode;
            const ui = decodeWeather(code);
            
            document.getElementById('desc').innerText = ui.label;
            document.querySelector('#icon i').className = ui.icon;
            
            // Ganti Background
            document.body.style.background = ui.bg;
        }

        // Menerjemahkan Kode Cuaca Open-Meteo (WMO Code)
        function decodeWeather(code) {
            // Default
            let res = { label: "Tidak diketahui", icon: "fas fa-question", bg: "var(--bg-default)" };

            if (code === 0) {
                res = { label: "Cerah", icon: "fas fa-sun", bg: "var(--bg-sun)" };
            } else if ([1, 2, 3].includes(code)) {
                res = { label: "Berawan", icon: "fas fa-cloud-sun", bg: "var(--bg-cloud)" };
            } else if ([45, 48].includes(code)) {
                res = { label: "Kabut", icon: "fas fa-smog", bg: "var(--bg-cloud)" };
            } else if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) {
                res = { label: "Hujan", icon: "fas fa-cloud-showers-heavy", bg: "var(--bg-rain)" };
            } else if ([71, 73, 75, 77].includes(code)) {
                res = { label: "Salju", icon: "fas fa-snowflake", bg: "var(--bg-rain)" };
            } else if ([95, 96, 99].includes(code)) {
                res = { label: "Badai Petir", icon: "fas fa-bolt", bg: "var(--bg-rain)" };
            }
            return res;
        }

        function getWindDir(deg) {
            const dirs = ['U', 'TL', 'T', 'TG', 'S', 'BD', 'B', 'BL'];
            return dirs[Math.round(deg / 45) % 8];
        }

        // --- GPS Logic ---
        function getGeoLocation() {
            if (!navigator.geolocation) return alert("Browser tidak support GPS");
            document.getElementById('loader').style.display = 'block';
            
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                
                // Fetch Cuaca Langsung via Koordinat
                try {
                    // Cari nama kota dulu biar cantik (Reverse Geo)
                    const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const geoJson = await geoRes.json();
                    let city = geoJson.address.city || geoJson.address.town || geoJson.address.village;
                    let admin = geoJson.address.state || "Indonesia";
                    
                    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&windspeed_unit=kmh`);
                    const weatherData = await weatherRes.json();
                    
                    renderUI(weatherData.current_weather, city, admin, 0, weatherData.utc_offset_seconds);
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('cityInput').value = city;
                } catch(e) {
                    alert("Gagal mengambil data GPS");
                    document.getElementById('loader').style.display = 'none';
                }
            });
        }

        // --- Install Prompt ---
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            const btn = document.getElementById('installBtn');
            btn.style.display = 'block';
            btn.addEventListener('click', () => {
                btn.style.display = 'none';
                e.prompt();
            });
        });
    </script>
</body>
</html>
